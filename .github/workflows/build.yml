name: Build & Push Native Docker Image & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/jaamesokhan-server:latest
            ${{ secrets.DOCKER_USERNAME }}/jaamesokhan-server:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker pull ${{ secrets.DOCKER_USERNAME }}/jaamesokhan-server:${{ github.sha }}
          docker stop jaamesokhan-server || true
          docker rm jaamesokhan-server || true
          docker run -d --name jaamesokhan-server -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/jaamesokhan-server:${{ github.sha }}
